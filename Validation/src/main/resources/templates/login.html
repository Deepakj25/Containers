<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-indigo-900 to-sky-900 flex items-center justify-center p-4">
<div class="w-full max-w-md bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-8 border border-white/20">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-white">Welcome</h1>
        <p class="text-slate-300">Sign in to continue</p>
    </div>

    <form th:action="@{/login}" method="post" th:object="${form}" class="space-y-6">
        <div>
            <label class="block text-slate-200 mb-2">Email</label>
            <input th:field="*{email}" type="email" placeholder="you@example.com"
                   class="w-full rounded-xl bg-white/80 border border-slate-300 p-3 focus:outline-none focus:ring-4 focus:ring-indigo-300" />
            <p class="text-rose-300 text-sm mt-2" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>

        <div>
            <label class="block text-slate-200 mb-2">Password</label>
            <input th:field="*{password}" type="password" placeholder="••••••••"
                   class="w-full rounded-xl bg-white/80 border border-slate-300 p-3 focus:outline-none focus:ring-4 focus:ring-indigo-300" />
            <p class="text-rose-300 text-sm mt-2" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>

        <button type="submit" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold shadow-lg">
            Sign In
        </button>
    </form>

    <p class="text-xs text-slate-400 mt-6 text-center">Demo only • No database • No JWT</p>
</div>
</body>
</html>
